services:
  checkmate-app:
    build: .
    command: sh -c "npm install && npx ng serve --host 0.0.0.0"
    ports:
      - "4200:4200"
    volumes:
      # Sincroniza el código local con el contenedor
      - .:/app
      # Evita que node_modules local sobreescriba al del contenedor
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
