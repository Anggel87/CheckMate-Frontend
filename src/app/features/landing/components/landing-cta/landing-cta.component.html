<section class="landing-cta" data-landing-section aria-labelledby="cta-title">
  <div class="landing-cta__inner" data-landing-animate>
    <img src="/img/logos/imagotipowhite.png" alt="CheckMate" />
    <div>
      <span>Portal listo para operar</span>
      <h2 id="cta-title">Ingresa a CheckMate y administra la asistencia desde un solo lugar</h2>
    </div>
    <a class="btn-checkmate landing-cta__button" [routerLink]="loginRoute">
      <i class="fa-solid fa-arrow-right-to-bracket" aria-hidden="true"></i>
      <span>Abrir portal</span>
    </a>
  </div>
</section>
