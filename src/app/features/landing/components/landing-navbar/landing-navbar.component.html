<header class="landing-navbar">
  <a
    class="landing-navbar__brand"
    href="#top"
    aria-label="Ir al inicio de CheckMate"
    (click)="scrollTo($event, 'top')"
  >
    <img src="/img/logos/isotipo.png" alt="" aria-hidden="true" />
    <span>CheckMate</span>
  </a>

  <nav class="landing-navbar__links" aria-label="Secciones de la pagina">
    @for (item of navItems; track item.targetId) {
      <a [href]="'#' + item.targetId" (click)="scrollTo($event, item.targetId)">
        {{ item.label }}
      </a>
    }
  </nav>

  <button
    type="button"
    class="btn-checkmate btn-checkmate-primary landing-navbar__action"
    (click)="openPortal()"
  >
    <i class="fa-solid fa-arrow-right-to-bracket" aria-hidden="true"></i>
    <span>Abrir portal</span>
  </button>
</header>
