<section id="benefits" class="landing-benefits" data-landing-section aria-labelledby="benefits-title">
  <div class="landing-benefits__inner">
    <div class="landing-benefits__heading" data-landing-animate>
      <span>Beneficios</span>
      <h2 id="benefits-title">Operacion mas rapida y decisiones mejor informadas</h2>
      <p>
        Cada registro queda disponible para consultar, justificar, reclamar y reportar
        sin depender de hojas sueltas o capturas tardias.
      </p>
    </div>

    <div class="landing-benefits__grid">
      @for (benefit of benefits; track benefit.title) {
        <article data-landing-animate>
          <i [class]="benefit.icon" aria-hidden="true"></i>
          <div>
            <h3>{{ benefit.title }}</h3>
            <p>{{ benefit.description }}</p>
          </div>
        </article>
      }
    </div>
  </div>
</section>
